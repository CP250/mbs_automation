name: obsidian-bg-agent
description: >
  PostCompact hook (OPT-IN, DISABLED BY DEFAULT). After Claude compacts the
  conversation context, spawns a headless Claude subprocess that propagates
  vault-worthy items from the compaction summary into P's pillar-structured
  vault. TRUST-GATED: it uses --dangerously-skip-permissions to write
  unattended, so it ships inert. It requires BOTH OBSIDIAN_VAULT_PATH and
  OBSIDIAN_BG_AGENT_ENABLED=1, plus a manual PostCompact registration in
  ~/.claude/settings.json (see hooks/postcompact.hook.example.json), before it
  does anything. Add/update only - never deletes, moves, or archives; never
  touches trash/ or existing human notes in bulk.
script: obsidian-bg-agent.sh
enabled: false
triggers:
  - event: post-compact
exclude: []
